apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: keda-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      containers:
        - name: worker
          image: keda-demo-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: QUEUE_NAME
              value: jobs
            - name: PROCESSING_TIME_SECONDS
              value: "2"
